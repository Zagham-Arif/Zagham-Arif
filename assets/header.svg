<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Zagham Arif, Senior Full-Stack Software Engineer</title>
  <desc id="d">Node.js, TypeScript, React, Next.js and AWS. 5+ years in production, 12 projects shipped, 7 teams worked with, 0 downtime on a live payments move. Available for remote projects and roles, UTC+5.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2436" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="18%" r="62%">
      <stop offset="0" stop-color="#6f8bff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6f8bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#0b1120" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0b1120" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
    <marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#6f8bff"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .node rect { fill: #0f1524; stroke: #2a3550; stroke-width: 1.5; }
    .node text { fill: #eef1f7; font-size: 15px; text-anchor: middle; }
    .node .sub { fill: #7c869c; font-size: 13px; }
    .edge { fill: none; stroke: #6f8bff; stroke-width: 1.6; stroke-dasharray: 5 7; marker-end: url(#tip); animation: flow 1.6s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 76px 67px; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.4); } }
    @media (prefers-reduced-motion: reduce) { .edge, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0b1120"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#fade)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="21.25" fill="none" stroke="#1c2436" stroke-width="1.5"/>

  <!-- Availability -->
  <circle class="pulse" cx="76" cy="67" r="6" fill="#84cc16"/>
  <circle cx="76" cy="67" r="6" fill="#84cc16"/>
  <text x="94" y="72" class="mono" font-size="16" letter-spacing="1.2" fill="#a3adc0">AVAILABLE FOR PROJECTS AND ROLES · REMOTE, UTC+5</text>

  <!-- Identity -->
  <text x="64" y="154" class="sans" font-size="74" font-weight="800" letter-spacing="-2" fill="#eef1f7">Zagham Arif</text>
  <text x="66" y="198" class="sans" font-size="27" font-weight="600" fill="#6f8bff">Senior Full-Stack Software Engineer</text>
  <text x="66" y="232" class="mono" font-size="17" fill="#a3adc0">Node.js · TypeScript · React · Next.js · AWS</text>

  <!-- System diagram -->
  <g class="mono">
    <path class="edge" d="M826 103H864"/>
    <path class="edge" d="M990 103H1028"/>
    <path class="edge" d="M929 128V152H763V176"/>
    <path class="edge" d="M826 203H864"/>
    <path class="edge" d="M990 203H1028"/>

    <g class="node"><rect x="700" y="78" width="124" height="50" rx="10"/><text x="762" y="100">users</text><text class="sub" x="762" y="116">10× spike</text></g>
    <g class="node"><rect x="866" y="78" width="124" height="50" rx="10" style="stroke:#6f8bff"/><text x="928" y="100">API</text><text class="sub" x="928" y="116">idempotent</text></g>
    <g class="node"><rect x="1030" y="78" width="124" height="50" rx="10"/><text x="1092" y="100">cache</text><text class="sub" x="1092" y="116">Redis</text></g>
    <g class="node"><rect x="700" y="178" width="124" height="50" rx="10"/><text x="762" y="200">queue</text><text class="sub" x="762" y="216">backpressure</text></g>
    <g class="node"><rect x="866" y="178" width="124" height="50" rx="10"/><text x="928" y="200">workers</text><text class="sub" x="928" y="216">2 → 8</text></g>
    <g class="node"><rect x="1030" y="178" width="124" height="50" rx="10"/><text x="1092" y="200">DB</text><text class="sub" x="1092" y="216">2M+ rows / run</text></g>
  </g>

  <!-- Numbers -->
  <path d="M64 268H1136" stroke="#1c2436" stroke-width="1.5"/>
  <g class="sans" font-size="48" font-weight="800" fill="#eef1f7">
    <text x="64" y="326">5+</text>
    <text x="332" y="326">12</text>
    <text x="600" y="326">7</text>
    <text x="868" y="326">0</text>
  </g>
  <g class="mono" font-size="17" letter-spacing="0.6" fill="#a3adc0">
    <text x="64" y="356">YEARS IN PRODUCTION</text>
    <text x="332" y="356">PROJECTS SHIPPED</text>
    <text x="600" y="356">TEAMS WORKED WITH</text>
    <text x="868" y="356">DOWNTIME ON A LIVE</text>
    <text x="868" y="378">PAYMENTS MIGRATION</text>
  </g>
</svg>
